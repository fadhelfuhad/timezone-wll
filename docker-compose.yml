version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: timezone_wll_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: timezone_wll
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timezone_wll_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:password@postgres:5432/timezone_wll?schema=public
      JWT_SECRET: change-this-secret-in-production
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: change-this-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 30d
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:5173
    ports:
      - '3001:3001'
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: timezone_wll_web
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:

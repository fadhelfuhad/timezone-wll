# Render Blueprint — Timezone W.L.L backend API (NestJS).
# Frontend is deployed separately on Vercel; database on Supabase.
# In the Render dashboard: New > Blueprint, connect this repo, then fill in the
# env vars marked `sync: false` (Supabase URLs, CORS origin, seed passwords).
services:
  - type: web
    name: timezone-wll-api
    runtime: node
    region: singapore # closest Render region to the Supabase ap-south-1 (Mumbai) DB
    plan: free
    rootDir: backend
    # migrate deploy runs at build time (Render free has no pre-deploy hook);
    # Prisma uses DIRECT_URL for migrations via the schema's directUrl.
    buildCommand: corepack enable && pnpm install --frozen-lockfile=false && pnpm prisma generate && pnpm build && pnpm prisma migrate deploy
    startCommand: pnpm start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OCR_PROVIDER
        value: tesseract
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      # Secrets and connection strings — set these in the dashboard.
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Only needed for the one-time seed; can be removed afterwards.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_STAFF_PASSWORD
        sync: false
